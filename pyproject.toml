[project]
name = "home-assistant-mvg"
version = "2.2.1"
description = "Home-Assistant Integration for MVG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mvg>=1.6.0",
]

[dependency-groups]
dev = [
    "homeassistant-stubs>=2026.2.3",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
